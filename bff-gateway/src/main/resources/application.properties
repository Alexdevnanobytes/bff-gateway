server.port=8080
spring.application.name=bff-gateway

ms.usuarios.url=http://localhost:8081
ms.donaciones.url=http://localhost:8082

resilience4j.circuitbreaker.instances.ms-usuarios.slidingWindowSize=5
resilience4j.circuitbreaker.instances.ms-usuarios.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ms-usuarios.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.ms-donaciones.slidingWindowSize=5
resilience4j.circuitbreaker.instances.ms-donaciones.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ms-donaciones.waitDurationInOpenState=10s